<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="What's A Good Deal? — all the best current and future deals for the tech you love.">
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>What's A Good Deal?</title>
  <link rel="stylesheet" href="styles.css?v=76c0c0370e">
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <p class="week-label" id="week-label">Updated recently</p>
    </div>
  </header>

  <div class="pull-refresh" id="pull-refresh" aria-hidden="true" aria-live="polite">
    <span class="pull-refresh__spinner" aria-hidden="true"></span>
    <span id="pull-refresh-label">Pull to refresh</span>
  </div>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__inner">
        <p class="hero__eyebrow"><span class="hero__pulse" aria-hidden="true"></span>Verified retailer prices</p>
        <h1 id="hero-title">What's A <span class="hero__accent">Good Deal?</span></h1>
        <p class="hero__lede">The best current and upcoming deals on the tech you love.</p>
      </div>
    </section>

    <section class="filters" id="filters" aria-label="Filter deals" hidden>
      <div class="filters__bar">
        <div class="filters__inner" id="filter-buttons" role="toolbar" aria-label="Categories"></div>
        <div class="filter-tools">
          <div class="tool-wrap">
            <button type="button" class="tool-btn" id="budget-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="budget-menu" aria-label="Price filter"></button>
            <div class="tool-menu" id="budget-menu" role="menu" aria-label="Price filter" hidden></div>
          </div>
          <div class="tool-wrap">
            <button type="button" class="tool-btn" id="sort-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu" aria-label="Sort deals"></button>
            <div class="tool-menu" id="sort-menu" role="menu" aria-label="Sort deals" hidden></div>
          </div>
        </div>
      </div>
    </section>

    <section class="search-panel" id="search-panel" hidden aria-label="Search deals">
      <div class="search-panel__inner">
        <label class="visually-hidden" for="deal-search">Search deals</label>
        <div class="search-field">
          <input
            type="search"
            id="deal-search"
            class="search-field__input"
            placeholder="Search deals — e.g. GPU, cases, Klipsch…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="search"
          >
          <button type="button" class="search-field__clear" id="deal-search-clear" hidden aria-label="Clear search">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="search-recent" id="search-recent" hidden></div>
      </div>
    </section>

    <section class="deals" id="deals" aria-live="polite" aria-busy="true">
      <p class="status" id="status">Loading&hellip;</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Prices checked from retailer listings. Always confirm the live cart total before buying.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close photo">
      <span aria-hidden="true">&times;</span>
    </button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" id="lightbox-img" alt="">
    </figure>
  </div>

  <script src="app.js?v=ef274cd691" defer></script>
</body>
</html>
