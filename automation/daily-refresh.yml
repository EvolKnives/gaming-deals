name: Hourly deals refresh

# Re-verifies current prices, prunes dead/unverifiable listings (after 3
# calendar days, not 3 runs), tops categories back up, keeps upcoming Future
# deals without a Newegg check, and commits data/deals.json only when deal
# data meaningfully changed — so hourly runs do not spam timestamp-only
# commits or GitHub Pages rebuilds.
on:
  schedule:
    # Minute 17 past every hour, to avoid top-of-hour congestion.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh deals
        run: python scripts/daily_refresh.py

      - name: Validate deals.json
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/deals.json"))
          deals = d["deals"]
          assert len(deals) >= 40, f"only {len(deals)} deals — refusing to publish"
          for x in deals:
              assert x.get("url", "").startswith("http"), x.get("id")
              assert isinstance(x.get("price"), (int, float)) and x["price"] > 0, x.get("id")
          future = [x for x in deals if x.get("startsAt")]
          print(f"OK: {len(deals)} deals, {len(future)} with startsAt, updatedAt {d['updatedAt']}")
          PY

      - name: Commit and push
        id: commit
        run: |
          git config user.name "deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data images
          if git diff --cached --quiet; then
            echo "No changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "Hourly deals refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (push should still trigger it)"
