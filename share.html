<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Post maker · What's A Good Deal?</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    /* Owner tool (not linked from the site): this week's top 10 deals laid out
       as a 1080×1350 social post. Screenshot it, or open on a laptop and use
       the browser's "capture node screenshot". */
    :root { --accent: #64d2ff; }
    html, body { margin: 0; background: #05060a; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif; }
    .tools { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; font-size: 14px; color: #a1a1a6; }
    .tools button { border: 1px solid #2c3346; background: #151925; color: #e5e7ee; border-radius: 999px;
      padding: 8px 14px; font: inherit; cursor: pointer; }
    .tools button.is-on { background: var(--accent); color: #06121d; border-color: var(--accent); }
    .stage { display: flex; justify-content: center; padding: 0 0 40px; }
    .post { width: 1080px; height: 1350px; box-sizing: border-box; padding: 70px 72px 56px; position: relative;
      background: radial-gradient(ellipse at 10% 0%, rgba(100,210,255,.18), transparent 50%),
                  radial-gradient(ellipse at 100% 100%, rgba(139,125,255,.22), transparent 55%), #0b0d12;
      transform-origin: top center; display: flex; flex-direction: column; }
    .eyebrow { color: var(--accent); font-weight: 800; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 6px; font-size: 76px; line-height: 1; letter-spacing: -.04em; font-weight: 850; }
    h1 span { background: linear-gradient(92deg, #64d2ff, #8b7dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: #a1a1a6; font-size: 26px; margin-bottom: 26px; }
    ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; flex: 1; min-height: 0; }
    li { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 40px 84px 1fr auto; align-items: center; gap: 16px;
      background: #151925; border: 1px solid #232a3b; border-radius: 18px; padding: 6px 18px 6px 12px; }
    .rank { font-size: 30px; font-weight: 800; color: #6b7280; text-align: center; }
    li:first-child .rank { color: var(--accent); }
    .thumb { width: 84px; height: 64px; border-radius: 14px; background: radial-gradient(ellipse at 50% 45%, #fff 0%, #e7ebf2 85%);
      display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 5px; box-sizing: border-box; mix-blend-mode: multiply; }
    .name { font-size: 22px; font-weight: 700; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; }
    .meta { margin-top: 2px; font-size: 17px; color: #8e95a5; }
    .price { text-align: right; white-space: nowrap; }
    .now { font-size: 29px; font-weight: 800; letter-spacing: -.02em; }
    .off { margin-top: 3px; display: inline-block; font-size: 17px; font-weight: 700; color: #30d158;
      background: rgba(48,209,88,.12); border: 1px solid rgba(48,209,88,.35); padding: 2px 10px; border-radius: 999px; }
    .foot { margin-top: 20px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; color: #a1a1a6; font-size: 24px; }
    .foot b { color: #f5f5f7; }
    .status { text-align: center; color: #a1a1a6; padding: 40px; }
  </style>
</head>
<body>
  <div class="tools">
    <span>Top 10 for:</span>
    <button type="button" data-mode="all" class="is-on">All deals</button>
    <button type="button" data-mode="pc">PC parts</button>
    <button type="button" data-mode="gear">Gaming gear</button>
    <span style="margin-left:auto">Screenshot the card below to post it.</span>
  </div>
  <div class="stage"><div class="post" id="post"><p class="status">Loading deals…</p></div></div>
  <script>
  (function () {
    "use strict";
    var SITE = "evolknives.github.io/gaming-deals";
    var PC = ["GPUs", "CPUs", "Motherboards", "RAM", "SSDs", "PSUs", "Cases", "Coolers", "Monitors", "Prebuilts"];
    var GEAR = ["Mice", "Keyboards", "Gaming Headsets", "Headphones", "Earbuds", "Controllers", "Microphones", "Webcams",
      "Wireless Speakers", "Computer Speakers"];
    var deals = [];
    var mode = "all";
    var post = document.getElementById("post");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function money(n) {
      return Number(n).toLocaleString("en-US", { style: "currency", currency: "USD",
        minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    }
    function shortName(name) {
      var n = String(name || "").split(/ [-–—|] |, /)[0];
      return n.length > 70 ? n.slice(0, 68) + "…" : n;
    }
    function smallImg(src) {
      return String(src || "").replace("/ProductImageCompressAll1280/", "/ProductImageCompressAll640/");
    }

    function pick() {
      var cats = mode === "pc" ? PC : mode === "gear" ? GEAR : null;
      var scored = deals.filter(function (d) {
        var was = Number(d.previousPrice), price = Number(d.price);
        return !d.startsAt && d.image && was > price && price > 0 && (!cats || cats.indexOf(d.category) !== -1) &&
          !d.wasUnseen && (!d.rating || d.rating >= 4);
      }).map(function (d) {
        var pct = (d.previousPrice - d.price) / d.previousPrice * 100;
        // big claimed discounts count less above 50%, so clearance markdowns don't crowd the list
        var score = Math.min(pct, 50) + Math.max(0, pct - 50) * 0.3 +
          Math.min(25, (d.previousPrice - d.price) / 20) + (d.lowest30 ? 12 : 0) + (d.priceDropped ? 6 : 0);
        return { d: d, pct: pct, score: score };
      }).sort(function (a, b) { return b.score - a.score; });
      var perCat = {}, out = [];
      for (var i = 0; i < scored.length && out.length < 10; i++) {
        var c = scored[i].d.category;
        if ((perCat[c] || 0) >= 2) continue;
        perCat[c] = (perCat[c] || 0) + 1;
        out.push(scored[i]);
      }
      return out;
    }

    function render() {
      var top = pick();
      var today = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      var title = mode === "pc" ? "PC part deals" : mode === "gear" ? "Gaming gear deals" : "Tech deals";
      post.innerHTML =
        '<div class="eyebrow">Top 10 this week</div>' +
        "<h1>" + title.replace(" deals", "") + ' <span>deals</span></h1>' +
        '<div class="sub">Real price cuts, checked hourly · ' + esc(today) + "</div>" +
        (top.length
          ? "<ol>" + top.map(function (t, i) {
              var d = t.d;
              return "<li>" +
                '<span class="rank">' + (i + 1) + "</span>" +
                '<span class="thumb"><img src="' + esc(smallImg(d.image)) + '" alt="" referrerpolicy="no-referrer"' +
                ' onerror="this.style.visibility=\'hidden\'"></span>' +
                '<span><div class="name">' + esc(shortName(d.name)) + "</div>" +
                '<div class="meta">' + esc(d.category) + " · " + esc(d.merchant || "") +
                (d.lowest30 ? " · lowest in 30 days" : "") + "</div></span>" +
                '<span class="price"><div class="now">' + money(d.price) + "</div>" +
                '<span class="off">' + Math.round(t.pct) + "% off</span></span>" +
                "</li>";
            }).join("") + "</ol>"
          : '<p class="status">Not enough deals with photos and real discounts right now.</p>') +
        '<div class="foot"><span>Prices change fast, so check before buying.</span><b>' + SITE + "</b></div>";
      fit();
    }

    function fit() {
      var s = Math.min(1, (window.innerWidth - 16) / 1080);
      post.style.transform = "scale(" + s + ")";
      post.parentNode.style.height = Math.ceil(1350 * s) + 40 + "px";
    }

    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () {
        mode = b.getAttribute("data-mode");
        document.querySelectorAll("[data-mode]").forEach(function (x) { x.classList.toggle("is-on", x === b); });
        render();
      });
    });
    window.addEventListener("resize", fit);
    fetch("data/deals.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) { deals = data.deals || []; render(); })
      .catch(function () { post.innerHTML = '<p class="status">Couldn’t load deals.</p>'; });
  })();
  </script>
</body>
</html>
